<!DOCTYPE html>
<html><head><title>Login</title><link rel="stylesheet" href="/static/css/auth.css"></head>
<body>
<div class="bg-animation"></div>
<div class="auth-container"><div class="auth-box">
<h1>🔑 Login</h1><p class="subtitle">Access your CloudStock account</p>
<div id="alertBox" class="alert"></div>
<form id="loginForm">
<div class="form-group"><input type="email" id="email" required placeholder="Email"></div>
<div class="form-group"><input type="password" id="password" required placeholder="Password"></div>
<button type="submit" class="btn-submit">Login</button>
<div class="loading">⏳ Logging in...</div>
</form>
<div class="auth-footer">Don't have an account? <a href="/register">Register</a></div>
</div></div>
<script src="/static/js/login.js"></script>
</body></html>
